[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragnet-cmr"
version = "0.1.0"
description = "Public, data-safe implementation refresh of DragNet for probabilistic cardiac CMR registration and sequence generation."
readme = "README.md"
requires-python = ">=3.10"
maintainers = [{name = "Alireza Hokmabadi"}]
keywords = [
  "cardiac-mri",
  "cmr",
  "deformable-registration",
  "deep-learning",
  "medical-imaging",
  "sequence-generation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
]

[project.scripts]
dragnet-cmr = "dragnet_cmr.cli:main"

[project.urls]
Paper = "https://doi.org/10.1016/j.media.2022.102678"
Repository = "https://github.com/alireza-hokmabadi/DragNet"
Issues = "https://github.com/alireza-hokmabadi/DragNet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
